name: Go OVP8xx package

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5
        with:
          lfs: 'true'
      - name: 👷 Prepare the Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: 🧪 Run the unit tests
        run: go test -v -failfast -coverprofile cover.out -timeout=1m ./...
      - name: 🚀 Upload the coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Build the CLI
        run: go build cmd/ovp8xx/ovp8xx.go

  # Provides the CLI of a pull request for all platforms as a workflow
  # artifact, so a change can be tested without building it locally.
  snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # required to link the snapshot in a comment of the pull request
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # the version of the snapshot is derived from the latest tag
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build the snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          # Keep in sync with the GoReleaser version embedded in
          # go-semantic-release/hooks-goreleaser, see .goreleaser.yaml
          version: v2.3.2
          args: release --snapshot --clean --skip=sbom
      - name: Upload the snapshot
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ovp8xx-pr-${{ github.event.pull_request.number }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
          # the archives are compressed already
          compression-level: 0
      # The artifacts are hard to find on the summary page of the workflow run,
      # so link them in the pull request. The comment is updated on each run.
      # The token of a pull request from a fork is not allowed to comment.
      - name: Link the snapshot in the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --edit-last --create-if-none --body-file - <<EOF
          📦 **Snapshot build** of ${HEAD_SHA}: [ovp8xx-pr-${PR_NUMBER}](${ARTIFACT_URL})

          The archive contains the CLI for all platforms. A GitHub login is required for the download, the snapshot is kept for 14 days.
          EOF

  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # syft is required by goreleaser to generate the SBOMs of the release archives
      - uses: anchore/sbom-action/download-syft@v0
      - uses: go-semantic-release/action@v1
        with:
          hooks: goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}