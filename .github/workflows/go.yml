name: Go OVP8xx package

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v3
        with:
          lfs: 'true'
      - name: 👷 Prepare the Go environment
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - name: 🧪 Run the unit tests
        run: go test -v -failfast -coverprofile cover.out -timeout=1m ./...
      - name: 🚀 Upload the coverage reports to Codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Build the CLI
        run: go build cmd/ovp8xx/ovp8xx.go

  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      # syft is required by goreleaser to generate the SBOMs of the release archives
      - uses: anchore/sbom-action/download-syft@v0
      - uses: go-semantic-release/action@v1
        with:
          hooks: goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}